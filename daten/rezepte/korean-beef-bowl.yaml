id: korean-beef-bowl
name: Korean Beef Bowl mit Gochujang
hauptkategorie: schnell
kategorien_manuell: [Meal Prep]
mahlzeit: Mittag/Abend
geschmack: herzhaft
kueche: Asiatisch
hauptprotein: Rind
inspiration:
  quelle: "TikTok-/Instagram-Trend „Korean Ground Beef Bowl“"
  link: null
  aenderungen: "Mageres Rinderhack (5 %) statt normalem Hack, weniger Zucker in der Sauce (Honig abgewogen), dazu knackige Gurke statt Kimchi aus dem Asialaden."
schwierigkeit: leicht
zeit: {vorbereitung: 5, kochen: 17, wartezeit: 0}
ausstattung: ["Große Pfanne (28 cm)", "Kleiner Topf mit Deckel (16 cm)", Sieb]
restetauglich: true
vortag: []
zutaten:
  - gruppe: Reis
  - {id: reis, zutat: Basmatireis ungekocht, g: 150, name: Basmatireis, hinweis: ""}
  - {id: wasser_reis, zutat: Wasser, g: 300, name: Wasser, hinweis: "300 ml"}
  - gruppe: Beef
  - {id: oel, zutat: Rapsöl, g: 5, anzeige: "1 TL Rapsöl", hinweis: ""}
  - {id: hack, zutat: Rinderhackfleisch 5 % Fett roh, g: 400, name: Rinderhack, hinweis: "mager (5 % Fett)"}
  - {id: knoblauch, zutat: Knoblauch, g: 6, anzeige: "2 Knoblauchzehen", hinweis: ""}
  - {id: ingwer, zutat: Ingwer, g: 8, anzeige: "1 Stück Ingwer (2 cm)", hinweis: ""}
  - {id: gochujang, zutat: Gochujang, g: 30, anzeige: "2 EL Gochujang", hinweis: "koreanische Chilipaste"}
  - {id: soja, zutat: Sojasauce, g: 20, anzeige: "1½ EL Sojasauce", hinweis: ""}
  - {id: honig, zutat: Honig, g: 15, anzeige: "2 TL Honig", hinweis: "gehäuft"}
  - {id: sesamoel, zutat: Sesamöl geröstet, g: 5, anzeige: "1 TL geröstetes Sesamöl", hinweis: ""}
  - gruppe: Toppings
  - {id: gurke, zutat: Salatgurke, g: 150, anzeige: "⅓ Salatgurke", name: Gurke, hinweis: ""}
  - {id: fruehlingszwiebel, zutat: Frühlingszwiebel, g: 30, anzeige: "3 Frühlingszwiebeln", hinweis: ""}
  - {id: sesam, zutat: Sesam, g: 6, anzeige: "2 TL Sesam", hinweis: ""}
mise_en_place:
  - "{reis} kalt abspülen."
  - "{knoblauch} und {ingwer} fein reiben. {gochujang}, {soja} und {honig} glatt verrühren."
  - "{gurke} längs halbieren und in 3 mm Scheiben schneiden, {fruehlingszwiebel} in Ringe (helles und dunkles Grün getrennt)."
schritte:
  - titel: Reis aufsetzen
    text: "{reis:n} mit {wasser_reis} im Topf mit Deckel auf Stufe 9 von 9 aufkochen, dann auf Stufe 2 von 9 12 Minuten quellen und 5 Minuten nachziehen lassen."
    timer_min: 12
  - titel: Hack knusprig braten
    text: "{oel} in der Pfanne auf Stufe 8 von 9 erhitzen. {hack} hineingeben, 2 Minuten ohne Rühren anbraten lassen, dann krümelig zerteilen und weitere 5 Minuten braten, bis es rundum braun und an den Rändern knusprig ist. Garprobe: kein rosa Fleisch mehr, Kerntemperatur über 72 °C."
    timer_min: 7
  - titel: Glasieren
    text: "Knoblauch, Ingwer und das helle Grün der Frühlingszwiebeln 1 Minute mitbraten. Auf Stufe 5 von 9 zurückschalten, die Gochujang-Mischung einrühren und 1–2 Minuten köcheln lassen, bis das {hack:n} glänzend überzogen ist. Vom Herd nehmen und {sesamoel} unterrühren."
    timer_min: 2
zeitablauf:
  - "Reis aufsetzen, dann sofort das Hack braten – beides ist nach ca. 17 Minuten fertig. Gurke schneiden, während das Hack brät."
fehler:
  - "**Hack grau und wässrig:** zu früh gerührt. 2 Minuten liegen lassen, damit es Kruste bekommt."
  - "**Zu scharf:** Gochujang-Sorten sind unterschiedlich scharf. Mit 1 EL beginnen, probieren."
anrichten: "Reis auf 2 Bowls verteilen (je ca. 210 g gekocht), das Beef daneben, Gurkenscheiben, dunkles Frühlingszwiebelgrün und {sesam:n} obenauf – pro Portion ca. {portion_g} g."
aufbewahrung:
  kuehlschrank_tage: 3
  einfrierbar: true
  einfrieren_monate: 2
  aufwaermen: "Beef und Reis in der Mikrowelle 600 W 2½ Minuten abgedeckt; Gurke kalt dazu."
  separat: "Gurke und Toppings getrennt lagern; Reis innerhalb von 1 Stunde kalt stellen."
varianten:
  - "**Mit Putenhack:** 400 g Putenhack statt Rind (+18 kcal, −3 g Protein pro Portion)."
  - "**Mit Spiegelei:** pro Portion 1 Spiegelei obenauf (+84 kcal, +7,6 g Protein pro Portion) – wie Bibimbap."
  - "**Weniger Reis:** nur 100 g Reis (−88 kcal, −19,2 g KH pro Portion)."
tipps:
  - "Ein paar Spritzer Zitronensaft auf die Gurken – frisch-säuerlich wie schnelles Pickle."
gargewicht_g: null
bewertung: {sterne: null, kommentar: null, datum: null}
