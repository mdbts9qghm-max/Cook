id: protein-scones
name: Protein-Scones mit Beeren
hauptkategorie: meal-prep
kategorien_manuell: [Meal Prep]
mahlzeit: Frühstück
geschmack: süß
kueche: International / Fusion
hauptprotein: Quark & Whey
inspiration: null
schwierigkeit: mittel
zeit: {vorbereitung: 12, kochen: 18, wartezeit: 5}
ausstattung: [Backofen, Backblech, Backpapier, Schüssel]
restetauglich: true
vortag: []
zutaten:
  - gruppe: Teig
  - {id: mehl, zutat: Weizenmehl Type 405, g: 150, name: Mehl, hinweis: "plus 1 EL zum Formen (nicht mitgerechnet)"}
  - {id: whey, zutat: Whey Protein Vanille, g: 30, name: "Vanille-Whey", hinweis: "1 Messlöffel"}
  - {id: backpulver, zutat: Backpulver, g: 10, anzeige: "2 TL Backpulver", hinweis: ""}
  - {id: salz, zutat: Salz, g: 0.5, anzeige: "1 Prise Salz", hinweis: ""}
  - {id: butter, zutat: Butter, g: 30, name: Butter, hinweis: "eiskalt, in kleinen Würfeln"}
  - {id: quark, zutat: Magerquark, g: 200, name: Magerquark, hinweis: ""}
  - {id: ei, zutat: "Ei Gr. M ohne Schale", g: 60, anzeige: "1 Ei Gr. M", hinweis: "verquirlt, 1 EL davon zum Bestreichen"}
  - {id: suessstoff, zutat: Süßstoff flüssig, g: 1, anzeige: "10 Tropfen flüssiger Süßstoff", hinweis: ""}
  - {id: heidelbeeren, zutat: Heidelbeeren TK, g: 100, name: Heidelbeeren, hinweis: "gefroren"}
  - gruppe: Dazu
  - {id: skyr, zutat: Skyr natur, g: 150, name: Skyr, hinweis: "statt Clotted Cream"}
mise_en_place:
  - "Backofen auf 200 °C Ober-/Unterhitze (180 °C Umluft) vorheizen, Blech mit Backpapier auslegen."
  - "{butter} in 5 mm Würfel schneiden und im Kühlschrank kalt halten."
schritte:
  - titel: Teig krümeln
    text: "{mehl}, {whey}, {backpulver} und {salz} in einer Schüssel mischen. Die kalte {butter:n} mit den Fingerspitzen in 2 Minuten zu groben Krümeln einreiben (die Butterstückchen dürfen erbsengroß bleiben – sie machen die Scones blättrig)."
    timer_min: null
  - titel: Teig zusammenfügen
    text: "{quark}, das {ei:n} (1 EL zurückbehalten) und {suessstoff} dazugeben und nur kurz mit einer Gabel vermengen, bis ein zotteliger Teig entsteht. Die gefrorenen {heidelbeeren:n} vorsichtig unterheben – nicht kneten."
    timer_min: null
  - titel: Formen und backen
    text: "Den Teig auf dem bemehlten Backpapier zu einem 3 cm hohen Kreis (ca. 18 cm) drücken, in 6 Tortenstücke schneiden und leicht auseinanderziehen. Mit dem restlichen Ei bestreichen. Im vorgeheizten Backofen bei 200 °C Ober-/Unterhitze (180 °C Umluft) auf der mittleren Schiene 16–18 Minuten backen, bis sie goldbraun und aufgegangen sind und beim Klopfen auf die Unterseite hohl klingen. 5 Minuten abkühlen lassen."
    timer_min: 18
zeitablauf:
  - "Während der Ofen vorheizt: Teig krümeln, formen und schneiden."
fehler:
  - "**Scones flach und zäh:** Butter zu warm oder Teig geknetet. Butter eiskalt und Teig nur kurz zusammenbringen."
  - "**Lila Teig:** Beeren aufgetaut. Gefroren unterheben."
anrichten: "3 Scones pro Portion, warm aufgeschnitten mit dem {skyr:n} – zusammen ca. {portion_g} g. Wie Afternoon Tea, nur zum Frühstück."
aufbewahrung:
  kuehlschrank_tage: 4
  einfrierbar: true
  einfrieren_monate: 2
  aufwaermen: "Im Ofen bei 180 °C Ober-/Unterhitze 5 Minuten oder Toaster-Aufsatz 2 Minuten."
  separat: "Skyr getrennt lagern."
varianten:
  - "**Himbeer-Scones:** 100 g TK-Himbeeren statt Heidelbeeren (−6 kcal, −2,8 g Zucker pro Portion)."
  - "**Schoko-Scones:** 30 g gehackte Zartbitterschokolade statt Beeren (+57 kcal pro Portion)."
  - "**Ohne Skyr:** (−47 kcal, −8,2 g Protein pro Portion)."
tipps:
  - "Etwas abgeriebene Zitronenschale im Teig – britischer Klassiker mit Blaubeeren."
gargewicht_g: null
bewertung: {sterne: null, kommentar: null, datum: null}
