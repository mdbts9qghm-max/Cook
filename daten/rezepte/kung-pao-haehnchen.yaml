id: kung-pao-haehnchen
name: Kung-Pao-Hähnchen
hauptkategorie: schnell
kategorien_manuell: []
mahlzeit: Mittag/Abend
geschmack: herzhaft
kueche: Asiatisch
hauptprotein: Hähnchen
inspiration: null
schwierigkeit: mittel
zeit: {vorbereitung: 8, kochen: 17, wartezeit: 0}
ausstattung: ["Wok oder große Pfanne (28 cm)", "Kleiner Topf mit Deckel (16 cm)", Sieb]
restetauglich: true
vortag: []
zutaten:
  - gruppe: Reis
  - {id: reis, zutat: Basmatireis ungekocht, g: 150, name: Basmatireis, hinweis: ""}
  - {id: wasser_reis, zutat: Wasser, g: 300, name: Wasser, hinweis: "300 ml"}
  - gruppe: Hähnchen
  - {id: haehnchen, zutat: Hähnchenbrustfilet roh, g: 400, name: Hähnchenbrust, hinweis: ""}
  - {id: staerke, zutat: Speisestärke, g: 15, anzeige: "1½ EL Speisestärke", hinweis: "10 g fürs Fleisch, 5 g für die Sauce"}
  - {id: oel, zutat: Rapsöl, g: 10, anzeige: "1 EL Rapsöl", hinweis: ""}
  - gruppe: Sauce
  - {id: soja, zutat: Sojasauce, g: 30, anzeige: "2 EL Sojasauce", hinweis: ""}
  - {id: honig, zutat: Honig, g: 15, anzeige: "2 TL Honig", hinweis: "gehäuft"}
  - {id: zitrone, zutat: Zitronensaft, g: 10, anzeige: "2 TL Zitronensaft", hinweis: "statt Reisessig"}
  - {id: erdnussmus, zutat: Erdnussmus, g: 15, anzeige: "1 EL Erdnussmus", hinweis: "für die Erdnuss-Note"}
  - {id: wasser, zutat: Wasser, g: 60, name: Wasser, hinweis: "60 ml"}
  - gruppe: Gemüse und Würze
  - {id: paprika, zutat: Paprika rot, g: 150, anzeige: "1 kleine rote Paprika", name: Paprika, hinweis: ""}
  - {id: fruehlingszwiebel, zutat: Frühlingszwiebel, g: 40, anzeige: "4 Frühlingszwiebeln", hinweis: ""}
  - {id: knoblauch, zutat: Knoblauch, g: 6, anzeige: "2 Knoblauchzehen", hinweis: ""}
  - {id: ingwer, zutat: Ingwer, g: 8, anzeige: "1 Stück Ingwer (2 cm)", hinweis: ""}
  - {id: chili, zutat: Chiliflocken, g: 1, anzeige: "½ TL Chiliflocken", hinweis: "nach Geschmack"}
mise_en_place:
  - "{reis} kalt abspülen."
  - "{haehnchen} in 2 cm Würfel schneiden und mit 10 g der {staerke:n} vermischen."
  - "Sauce: {soja}, {honig}, {zitrone}, {erdnussmus}, {wasser} und die restlichen 5 g Stärke glatt rühren."
  - "{paprika} in 2 cm Stücke, {fruehlingszwiebel} in 2 cm lange Stücke schneiden, {knoblauch} und {ingwer} fein hacken."
schritte:
  - titel: Reis aufsetzen
    text: "{reis:n} mit {wasser_reis} im Topf mit Deckel auf Stufe 9 von 9 aufkochen, auf Stufe 2 von 9 12 Minuten quellen und 5 Minuten nachziehen lassen."
    timer_min: 12
  - titel: Hähnchen anbraten
    text: "{oel} im Wok auf Stufe 9 von 9 erhitzen. Die {haehnchen:n}würfel in einer Lage 4–5 Minuten braten, nach 2 Minuten wenden, bis sie rundum goldbraun sind. Garprobe: Kerntemperatur 74 °C im größten Würfel, innen weiß. Herausnehmen."
    timer_min: 5
  - titel: Gemüse und Sauce
    text: "Auf Stufe 8 von 9 {paprika:n}, Frühlingszwiebeln, Knoblauch, Ingwer und {chili} 2 Minuten pfannenrühren. Hähnchen zurückgeben, Sauce noch einmal umrühren und dazugießen. 1 Minute unter Rühren köcheln lassen, bis die Sauce dick und glänzend ist."
    timer_min: 3
zeitablauf:
  - "Reis aufsetzen; während er quillt, alles schneiden und im Wok braten – Wokzeit nur ca. 8 Minuten."
fehler:
  - "**Fleisch zäh:** Stärke vergessen. Die Stärke-Hülle hält das Hähnchen saftig (chinesische „Velvet“-Technik)."
  - "**Sauce klumpt:** Stärke abgesetzt. Direkt vor dem Zugießen umrühren."
anrichten: "Reis auf 2 Teller verteilen (je ca. 210 g gekocht), Kung Pao daneben – pro Portion ca. {portion_g} g."
aufbewahrung:
  kuehlschrank_tage: 3
  einfrierbar: false
  aufwaermen: "Mikrowelle 600 W, 2½ Minuten abgedeckt, oder im Wok auf Stufe 7 von 9 2 Minuten."
  separat: "Reis innerhalb von 1 Stunde abkühlen und kalt stellen."
varianten:
  - "**Mit Pute:** 400 g Putenbrust (+6 kcal, +1 g Protein pro Portion)."
  - "**Mit Tofu:** 400 g Tofu-Würfel (+50 kcal, −21 g Protein pro Portion – dann unter 45 g Protein)."
  - "**Mehr Gemüse:** eine zweite Paprika (+26 kcal pro Portion)."
tipps:
  - "1 TL geröstetes Sesamöl zum Schluss und ein paar geröstete Erdnüsse obenauf – wie beim Chinesen (Erdnüsse: ca. 60 kcal pro 10 g)."
gargewicht_g: null
bewertung: {sterne: null, kommentar: null, datum: null}
