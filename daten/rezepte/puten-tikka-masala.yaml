id: puten-tikka-masala
name: Puten-Tikka-Masala
hauptkategorie: high-protein
kategorien_manuell: []
mahlzeit: Mittag/Abend
geschmack: herzhaft
kueche: Indisch
hauptprotein: Pute
inspiration: null
schwierigkeit: mittel
zeit: {vorbereitung: 15, kochen: 25, wartezeit: 30}
ausstattung: [Airfryer, "Große Pfanne (28 cm)", "Kleiner Topf mit Deckel (16 cm)", Sieb]
restetauglich: true
vortag: []
zutaten:
  - gruppe: Tikka (marinierte Pute)
  - {id: pute, zutat: Putenbrustfilet roh, g: 400, name: Putenbrust, hinweis: ""}
  - {id: joghurt, zutat: "Joghurt 1,5 % Fett", g: 100, name: Joghurt, hinweis: ""}
  - {id: garam_marinade, zutat: Garam Masala, g: 4, anzeige: "1½ TL Garam Masala", hinweis: ""}
  - {id: paprika_marinade, zutat: Paprikapulver edelsüß, g: 3, anzeige: "1 TL Paprikapulver edelsüß", hinweis: ""}
  - {id: zitrone, zutat: Zitronensaft, g: 10, anzeige: "2 TL Zitronensaft", hinweis: ""}
  - {id: salz_marinade, zutat: Salz, g: 1, anzeige: "2 Prisen Salz", hinweis: ""}
  - gruppe: Masala-Sauce
  - {id: oel, zutat: Rapsöl, g: 10, anzeige: "1 EL Rapsöl", hinweis: ""}
  - {id: zwiebel, zutat: Zwiebel, g: 100, anzeige: "1 Zwiebel", name: Zwiebel, hinweis: ""}
  - {id: paprika, zutat: Paprika rot, g: 150, anzeige: "1 kleine rote Paprika", name: Paprika, hinweis: ""}
  - {id: knoblauch, zutat: Knoblauch, g: 9, anzeige: "3 Knoblauchzehen", hinweis: ""}
  - {id: ingwer, zutat: Ingwer, g: 10, anzeige: "1 Stück Ingwer (2–3 cm)", hinweis: ""}
  - {id: garam, zutat: Garam Masala, g: 5, anzeige: "2 TL Garam Masala", hinweis: ""}
  - {id: kuemmel, zutat: Kreuzkümmel gemahlen, g: 2, anzeige: "1 TL Kreuzkümmel", hinweis: ""}
  - {id: kurkuma, zutat: Kurkuma gemahlen, g: 1, anzeige: "½ TL Kurkuma", hinweis: ""}
  - {id: chili, zutat: Chiliflocken, g: 1, anzeige: "¼ TL Chiliflocken", hinweis: ""}
  - {id: tomatenmark, zutat: Tomatenmark 2-fach konzentriert, g: 15, anzeige: "1 EL Tomatenmark", hinweis: ""}
  - {id: tomaten, zutat: Tomaten passiert, g: 400, name: "passierte Tomaten", hinweis: ""}
  - {id: honig, zutat: Honig, g: 5, anzeige: "1 TL Honig", hinweis: ""}
  - {id: salz, zutat: Salz, g: 1, anzeige: "2 Prisen Salz", hinweis: ""}
  - {id: skyr, zutat: Skyr natur, g: 150, name: Skyr, hinweis: "zum Schluss"}
  - gruppe: Reis
  - {id: reis, zutat: Basmatireis ungekocht, g: 150, name: Basmatireis, hinweis: ""}
  - {id: wasser_reis, zutat: Wasser, g: 300, name: Wasser, hinweis: "300 ml"}
mise_en_place:
  - "{pute} in 3 cm Würfel schneiden und mit {joghurt}, {garam_marinade}, {paprika_marinade}, {zitrone} und {salz_marinade} vermischen. Mindestens 30 Minuten (oder über Nacht) kühl marinieren."
  - "{zwiebel} in 2 cm Stücke, {paprika} in 2 cm Stücke schneiden, {knoblauch} und {ingwer} fein reiben. {reis} kalt abspülen."
schritte:
  - titel: Tikka im Airfryer rösten
    text: "Die marinierten {pute:n}würfel (überschüssige Marinade abstreifen) mit Abstand in den Airfryer legen und bei 200 °C 10–12 Minuten garen, nach 6 Minuten schütteln, bis die Kanten dunkle Röstflecken haben. Garprobe: Kerntemperatur 74 °C im größten Würfel, innen weiß."
    timer_min: 12
  - titel: Masala-Sauce
    text: "Parallel {oel} in der Pfanne auf Stufe 7 von 9 erhitzen. Zwiebel- und Paprikastücke 5 Minuten braten, bis sie Röstspuren haben. Knoblauch und Ingwer 1 Minute mitbraten. Auf Stufe 5 von 9 {garam}, {kuemmel}, {kurkuma}, {chili} und {tomatenmark} 1 Minute anrösten. {tomaten}, {honig} und {salz} einrühren und auf Stufe 3 von 9 10 Minuten köcheln lassen."
    timer_min: 17
  - titel: Reis aufsetzen
    text: "{reis:n} mit {wasser_reis} im Topf mit Deckel auf Stufe 9 von 9 aufkochen, auf Stufe 2 von 9 12 Minuten quellen und 5 Minuten nachziehen lassen."
    timer_min: 12
  - titel: Zusammenführen
    text: "Die gerösteten Tikka-Würfel in die Sauce geben und 2 Minuten auf Stufe 3 von 9 ziehen lassen. Pfanne vom Herd ziehen (Herd aus), 1 Minute abkühlen lassen und den {skyr} einrühren, bis die Sauce cremig-orange ist."
    timer_min: 2
zeitablauf:
  - "Reis und Sauce gleichzeitig ansetzen; die Pute kommt in den Airfryer, sobald die Sauce köchelt. Anders als beim Butter Chicken bleibt die Sauce stückig und die Pute hat Röstaromen."
fehler:
  - "**Sauce flockt:** Skyr in kochende Sauce gegeben. Erst vom Herd nehmen."
  - "**Pute trocken:** zu lange im Airfryer. Ab 10 Minuten messen."
anrichten: "Reis auf 2 Teller (je ca. 210 g gekocht), Tikka Masala daneben – pro Portion ca. {portion_g} g."
aufbewahrung:
  kuehlschrank_tage: 3
  einfrierbar: true
  einfrieren_monate: 2
  aufwaermen: "Im Topf auf Stufe 3 von 9 5 Minuten oder Mikrowelle 600 W 2½ Minuten abgedeckt; nicht aufkochen."
  separat: "Reis innerhalb von 1 Stunde abkühlen und getrennt lagern."
varianten:
  - "**Mit Hähnchen:** 400 g Hähnchenbrust (−6 kcal, −1 g Protein pro Portion)."
  - "**Mit Garnelen:** 450 g Garnelen, nur 3 Minuten in der Sauce garen statt Airfryer (−48 kcal, −12 g Protein pro Portion; nur 1 Tag haltbar)."
  - "**Mit Pita statt Reis:** 2 Pitabrote (200 g) (+2 kcal, +3 g Protein pro Portion)."
tipps:
  - "Über Nacht marinieren macht die Pute besonders zart und würzig."
gargewicht_g: null
bewertung: {sterne: null, kommentar: null, datum: null}
