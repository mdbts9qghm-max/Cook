id: high-protein-mac-cheese
name: High-Protein-Mac-and-Cheese
hauptkategorie: schnell
kategorien_manuell: []
mahlzeit: Mittag/Abend
geschmack: herzhaft
kueche: Amerikanisch
hauptprotein: Milchprodukte
inspiration:
  quelle: "TikTok-Trend „Cottage Cheese Mac and Cheese“"
  link: null
  aenderungen: "Käsesauce aus püriertem Hüttenkäse, Milch und Reibekäse light statt Butter-Mehl-Cheddar-Sauce; magere Kochschinkenwürfel für extra Protein."
schwierigkeit: leicht
zeit: {vorbereitung: 5, kochen: 15, wartezeit: 0}
ausstattung: ["Großer Topf (24 cm)", "Mixer oder Pürierstab mit hohem Rührbecher", Sieb]
restetauglich: true
vortag: []
zutaten:
  - gruppe: Pasta
  - {id: penne, zutat: Penne ungekocht, g: 180, name: Penne, hinweis: "oder Makkaroni"}
  - {id: kochwasser, zutat: Wasser, g: 2000, name: Wasser, hinweis: "2 l zum Kochen", mitrechnen: false}
  - {id: kochsalz, zutat: Salz, g: 15, anzeige: "1 knapper EL Salz fürs Nudelwasser", hinweis: "", mitrechnen: false}
  - gruppe: Käsesauce
  - {id: huettenkaese, zutat: Körniger Frischkäse (Hüttenkäse), g: 300, name: Hüttenkäse, hinweis: "1½ Becher"}
  - {id: milch, zutat: "Milch 1,5 % Fett", g: 150, name: "Milch (1,5 %)", hinweis: "150 ml"}
  - {id: staerke, zutat: Speisestärke, g: 5, anzeige: "1 TL Speisestärke", hinweis: ""}
  - {id: senf, zutat: Senf mittelscharf, g: 5, anzeige: "1 TL Senf", hinweis: "verstärkt den Käsegeschmack"}
  - {id: paprikapulver, zutat: Paprikapulver edelsüß, g: 1, anzeige: "½ TL Paprikapulver edelsüß", hinweis: ""}
  - {id: pfeffer, zutat: Pfeffer schwarz gemahlen, g: 0.5, anzeige: "2 Prisen Pfeffer", hinweis: ""}
  - {id: kaese, zutat: Reibekäse light (Gouda 30 % F. i. Tr.), g: 80, name: "Reibekäse light", hinweis: ""}
  - {id: schinken, zutat: Kochschinkenwürfel 3 % Fett, g: 75, name: Kochschinkenwürfel, hinweis: "1 Packung"}
  - gruppe: Crunch
  - {id: paniermehl, zutat: Paniermehl, g: 10, anzeige: "1 EL Paniermehl", hinweis: "in der Pfanne geröstet"}
mise_en_place:
  - "{huettenkaese}, {milch}, {staerke}, {senf}, {paprikapulver} und {pfeffer} im Mixer 20 Sekunden ganz glatt pürieren."
  - "{paniermehl} in einer trockenen Pfanne auf Stufe 5 von 9 2 Minuten goldbraun rösten."
schritte:
  - titel: Pasta kochen
    text: "{kochwasser} mit {kochsalz} auf Stufe 9 von 9 aufkochen, {penne} hineingeben und auf Stufe 7 von 9 1 Minute kürzer als auf der Packung angegeben kochen (meist 9–10 Minuten). Abgießen, ½ Tasse Nudelwasser aufheben."
    timer_min: 10
  - titel: Käsesauce
    text: "Den leeren Topf auf Stufe 3 von 9 stellen, die pürierte Hüttenkäse-Mischung hineingießen und unter Rühren 2 Minuten erwärmen, bis sie leicht bindet. Den {kaese:n} und den {schinken:n} einrühren, bis der Käse geschmolzen ist (nicht kochen, sonst wird die Sauce körnig)."
    timer_min: 2
  - titel: Mischen
    text: "Die Penne in die Sauce geben und 1 Minute auf Stufe 3 von 9 durchschwenken, bis alles cremig überzogen ist. Ist es zu dick, 2–3 EL Nudelwasser einrühren."
    timer_min: 1
zeitablauf:
  - "Während die Pasta kocht: Sauce pürieren und Paniermehl rösten."
fehler:
  - "**Sauce körnig:** zu heiß. Hüttenkäse-Sauce nur auf Stufe 3 von 9 erwärmen."
  - "**Schmeckt nach Quark:** zu glatt pürieren ist Pflicht – sonst bleiben Bröckchen; Senf und Pfeffer geben Käsigkeit."
anrichten: "Auf 2 tiefe Teller verteilen (je ca. {portion_g} g) und mit dem gerösteten {paniermehl:n} bestreuen – Crunch wie beim überbackenen Mac & Cheese."
aufbewahrung:
  kuehlschrank_tage: 3
  einfrierbar: false
  aufwaermen: "Mit 3 EL Milch im Topf auf Stufe 3 von 9 unter Rühren 4 Minuten oder Mikrowelle 600 W 2½ Minuten, zwischendurch umrühren."
  separat: "Paniermehl-Crunch getrennt lagern."
varianten:
  - "**Mit Hähnchen:** 200 g Hähnchenbrust in Würfeln statt Schinken anbraten bis 74 °C (+61 kcal, +16,4 g Protein pro Portion)."
  - "**Mit Linsennudeln:** 180 g Rote-Linsen-Nudeln (−22 kcal, +10,8 g Protein pro Portion)."
  - "**Mit Brokkoli:** 250 g Brokkoliröschen die letzten 4 Minuten mitkochen (+41 kcal, +3,8 g Protein pro Portion)."
tipps:
  - "Eine Prise Muskat und ein paar Spritzer Sriracha in der Sauce – so schmeckt es nach amerikanischem Diner."
gargewicht_g: null
bewertung: {sterne: null, kommentar: null, datum: null}
