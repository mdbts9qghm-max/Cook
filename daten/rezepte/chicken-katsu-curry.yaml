id: chicken-katsu-curry
name: Chicken Katsu Curry
hauptkategorie: high-protein
kategorien_manuell: []
mahlzeit: Mittag/Abend
geschmack: herzhaft
kueche: Asiatisch
hauptprotein: Hähnchen
inspiration:
  quelle: "TikTok-/Instagram-Trend „Chicken Katsu Curry“ (japanischer Imbiss-Klassiker)"
  link: null
  aenderungen: "Hähnchen im Airfryer mit 1 EL Öl statt frittiert; Currysauce aus Zwiebel, Möhre und Currypulver selbst gemacht statt Fertig-Würfel mit viel Fett."
schwierigkeit: mittel
zeit: {vorbereitung: 15, kochen: 20, wartezeit: 0}
ausstattung: [Airfryer, "Mittlerer Topf (20 cm)", "Kleiner Topf mit Deckel (16 cm)", Pürierstab, "3 tiefe Teller", "Fleischthermometer (empfohlen)"]
restetauglich: false
vortag: []
zutaten:
  - gruppe: Reis
  - {id: reis, zutat: Basmatireis ungekocht, g: 130, name: Basmatireis, hinweis: "oder Sushireis"}
  - {id: wasser_reis, zutat: Wasser, g: 260, name: Wasser, hinweis: "260 ml"}
  - gruppe: Katsu
  - {id: haehnchen, zutat: Hähnchenbrustfilet roh, g: 400, anzeige: "2 Hähnchenbrustfilets", name: Hähnchenbrust, hinweis: "à ca. 200 g"}
  - {id: salz, zutat: Salz, g: 1.5, anzeige: "¼ TL Salz", hinweis: ""}
  - {id: mehl_panade, zutat: Weizenmehl Type 405, g: 15, anzeige: "1½ EL Mehl", hinweis: ""}
  - {id: ei, zutat: "Ei Gr. M ohne Schale", g: 60, anzeige: "1 Ei Gr. M", hinweis: ""}
  - {id: paniermehl, zutat: Paniermehl, g: 60, name: Paniermehl, hinweis: "Panko, wenn vorhanden"}
  - {id: oel_panade, zutat: Rapsöl, g: 10, anzeige: "1 EL Rapsöl", hinweis: "zum Einpinseln"}
  - gruppe: Currysauce
  - {id: oel, zutat: Rapsöl, g: 5, anzeige: "1 TL Rapsöl", hinweis: ""}
  - {id: zwiebel, zutat: Zwiebel, g: 100, anzeige: "1 Zwiebel", name: Zwiebel, hinweis: ""}
  - {id: moehre, zutat: Möhre, g: 80, anzeige: "1 Möhre", name: Möhre, hinweis: ""}
  - {id: currypulver, zutat: Currypulver, g: 8, anzeige: "1 EL Currypulver", hinweis: "mild"}
  - {id: mehl, zutat: Weizenmehl Type 405, g: 15, anzeige: "1½ EL Mehl", hinweis: ""}
  - {id: tomatenmark, zutat: Tomatenmark 2-fach konzentriert, g: 10, anzeige: "2 TL Tomatenmark", hinweis: ""}
  - {id: bruehe, zutat: Gemüsebrühe Pulver, g: 4, anzeige: "1 TL Gemüsebrühe-Pulver", hinweis: ""}
  - {id: wasser, zutat: Wasser, g: 350, name: Wasser, hinweis: "350 ml"}
  - {id: soja, zutat: Sojasauce, g: 15, anzeige: "1 EL Sojasauce", hinweis: ""}
  - {id: honig, zutat: Honig, g: 10, anzeige: "2 TL Honig", hinweis: "japanisches Curry ist leicht süß"}
mise_en_place:
  - "{reis} kalt abspülen. {zwiebel} und {moehre} grob würfeln (1 cm)."
  - "{haehnchen} waagerecht halbieren und auf 1,5 cm Dicke flach drücken, mit {salz} würzen."
  - "Panierstraße: Teller 1 {mehl_panade}, Teller 2 {ei} verquirlt, Teller 3 {paniermehl}."
schritte:
  - titel: Currysauce kochen
    text: "{oel} im mittleren Topf auf Stufe 6 von 9 erhitzen. Zwiebel und Möhre 5 Minuten anbraten, bis die Zwiebel goldbraun ist. {currypulver}, {mehl} und {tomatenmark} einrühren und 1 Minute anschwitzen. Mit {wasser} und {bruehe} ablöschen, glatt rühren und auf Stufe 3 von 9 15 Minuten köcheln lassen, bis die Möhre weich ist. {soja} und {honig} einrühren und mit dem Pürierstab glatt pürieren."
    timer_min: 15
  - titel: Reis aufsetzen
    text: "{reis:n} mit {wasser_reis} im kleinen Topf mit Deckel auf Stufe 9 von 9 aufkochen, auf Stufe 2 von 9 12 Minuten quellen und 5 Minuten nachziehen lassen."
    timer_min: 12
  - titel: Katsu im Airfryer
    text: "Die {haehnchen:n} in Mehl wenden, durchs Ei ziehen und im Paniermehl wenden. Beidseitig mit {oel_panade} einpinseln. Im auf 200 °C vorgeheizten Airfryer 6 Minuten garen, wenden und weitere 6–7 Minuten garen, bis die Panade goldbraun und knusprig ist. Garprobe: Kerntemperatur 74 °C – ohne Thermometer anschneiden, innen weiß, Saft klar. 2 Minuten ruhen lassen, dann in 2 cm breite Streifen schneiden."
    timer_min: 13
zeitablauf:
  - "Zuerst die Currysauce ansetzen, dann den Reis. Während beides köchelt: Hähnchen panieren und in den Airfryer – alles ist nach ca. 20 Minuten fertig."
fehler:
  - "**Panade nicht knusprig:** zu wenig Öl oder Korb zu voll. Beide Seiten dünn einpinseln und nebeneinander legen."
  - "**Sauce klumpig:** Mehl nicht angeschwitzt. 1 Minute mit dem Curry anschwitzen, dann unter Rühren ablöschen; zum Schluss pürieren."
  - "**Sauce zu dick:** mit 2–3 EL Wasser verdünnen."
anrichten: "Reis als Halbkugel auf 2 Teller (je ca. 180 g gekocht), Katsu-Streifen daneben fächern und die Currysauce neben das Fleisch gießen, nicht darüber – so bleibt die Panade knusprig. Pro Portion ca. {portion_g} g."
aufbewahrung:
  kuehlschrank_tage: 2
  einfrierbar: false
  aufwaermen: "Katsu im Airfryer bei 180 °C 4 Minuten aufknuspern, Sauce und Reis in der Mikrowelle 600 W 2 Minuten."
  separat: "Sauce, Reis und Katsu getrennt lagern."
varianten:
  - "**Mit Pute:** 400 g Putenbrust (+6 kcal, +1 g Protein pro Portion)."
  - "**Tonkatsu vom Schwein:** 400 g Schweineschnitzel, 10–12 Minuten bis 63 °C (+8 kcal, −2 g Protein pro Portion)."
  - "**Weniger Reis:** 80 g statt 130 g (−88 kcal, −19,2 g KH pro Portion)."
tipps:
  - "Ein geriebener halber Apfel in der Sauce (zum Pürieren) gibt die typische fruchtige Süße des japanischen Currys."
gargewicht_g: null
bewertung: {sterne: null, kommentar: null, datum: null}
