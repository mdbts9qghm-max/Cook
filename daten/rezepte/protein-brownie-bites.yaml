mise_en_place:
  - "{hafer} fein mahlen, {schoko} hacken."
schritte:
  - titel: Teig rühren
    text: "{quark}, {ei}, {whey}, {kakao}, den gemahlenen {hafer:n}, {backpulver}, {suessstoff} und {salz} mit dem Schneebesen glatt rühren. Die Hälfte der gehackten {schoko:n} unterheben."
    timer_min: null
  - titel: Im Airfryer garen
    text: "Den Teig auf 8 Silikonförmchen verteilen und die restliche Schokolade obenauf streuen. Im auf 160 °C vorgeheizten Airfryer 10–12 Minuten garen. Fertig, wenn die Oberfläche fest ist, die Mitte aber beim Antippen noch leicht nachgibt – dann werden sie fudgy. 10 Minuten in den Förmchen abkühlen lassen."
    timer_min: 12
zeitablauf: []
fehler:
  - "**Trocken:** zu lange gegart. Lieber nach 10 Minuten prüfen."
  - "**Bitter:** zu wenig Süße. 5 Tropfen Süßstoff mehr und die Prise Salz nicht weglassen."
