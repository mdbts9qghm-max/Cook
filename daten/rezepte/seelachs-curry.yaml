id: seelachs-curry
name: Fisch-Curry mit Seelachs
hauptkategorie: kalorienarm
kategorien_manuell: []
mahlzeit: Mittag/Abend
geschmack: herzhaft
kueche: Indisch
hauptprotein: Fisch & Garnelen
inspiration: null
schwierigkeit: leicht
zeit: {vorbereitung: 7, kochen: 17, wartezeit: 0}
ausstattung: ["Große Pfanne mit Deckel (28 cm)", "Kleiner Topf mit Deckel (16 cm)", Sieb]
restetauglich: false
vortag: ["Seelachsfilet (TK) über Nacht im Kühlschrank auftauen"]
zutaten:
  - gruppe: Reis
  - {id: reis, zutat: Basmatireis ungekocht, g: 100, name: Basmatireis, hinweis: ""}
  - {id: wasser_reis, zutat: Wasser, g: 200, name: Wasser, hinweis: "200 ml"}
  - gruppe: Curry
  - {id: oel, zutat: Rapsöl, g: 5, anzeige: "1 TL Rapsöl", hinweis: ""}
  - {id: zwiebel, zutat: Zwiebel, g: 80, anzeige: "1 kleine Zwiebel", name: Zwiebel, hinweis: ""}
  - {id: knoblauch, zutat: Knoblauch, g: 6, anzeige: "2 Knoblauchzehen", hinweis: ""}
  - {id: ingwer, zutat: Ingwer, g: 8, anzeige: "1 Stück Ingwer (2 cm)", hinweis: ""}
  - {id: currypulver, zutat: Currypulver, g: 6, anzeige: "2 TL Currypulver", hinweis: ""}
  - {id: kurkuma, zutat: Kurkuma gemahlen, g: 1, anzeige: "½ TL Kurkuma", hinweis: ""}
  - {id: tomaten, zutat: Tomaten gehackt (Dose), g: 400, name: "gehackte Tomaten", hinweis: "1 Dose"}
  - {id: kokosmilch, zutat: Kokosmilch fettreduziert, g: 150, name: "Kokosmilch light", hinweis: ""}
  - {id: salz, zutat: Salz, g: 1.5, anzeige: "¼ TL Salz", hinweis: ""}
  - {id: fisch, zutat: Seelachsfilet TK roh, g: 400, name: Seelachs, hinweis: "aufgetaut, in 4 cm Stücken"}
  - {id: spinat, zutat: Babyspinat, g: 125, name: Babyspinat, hinweis: "1 Beutel"}
  - {id: zitrone, zutat: Zitronensaft, g: 10, anzeige: "2 TL Zitronensaft", hinweis: ""}
  - {id: petersilie, zutat: Petersilie glatt, g: 5, anzeige: "2 EL gehackte Petersilie", hinweis: "statt Koriander"}
mise_en_place:
  - "{reis} kalt abspülen."
  - "{zwiebel} würfeln, {knoblauch} und {ingwer} fein reiben."
  - "{fisch} trocken tupfen und in 4 cm Stücke schneiden. {petersilie} hacken."
schritte:
  - titel: Reis aufsetzen
    text: "{reis:n} mit {wasser_reis} im kleinen Topf mit Deckel auf Stufe 9 von 9 aufkochen, auf Stufe 2 von 9 12 Minuten quellen und 5 Minuten nachziehen lassen."
    timer_min: 12
  - titel: Currysauce
    text: "{oel} in der Pfanne auf Stufe 6 von 9 erhitzen. Zwiebel 4 Minuten braten, Knoblauch und Ingwer 1 Minute mitbraten. {currypulver} und {kurkuma} 30 Sekunden anrösten, dann {tomaten}, {kokosmilch} und {salz} einrühren und auf Stufe 4 von 9 5 Minuten köcheln lassen."
    timer_min: 6
  - titel: Fisch garen
    text: "Die {fisch:n}stücke in die Sauce legen, mit Sauce übergießen und mit Deckel auf Stufe 3 von 9 5–6 Minuten sanft ziehen lassen – nicht rühren, damit der Fisch nicht zerfällt. Garprobe: Der Fisch ist innen nicht mehr glasig und zerfällt bei leichtem Druck mit der Gabel in Lamellen. Den {spinat:n} am Rand unterheben und zusammenfallen lassen, mit {zitrone} abschmecken."
    timer_min: 6
zeitablauf:
  - "Reis aufsetzen, dann sofort die Currysauce – der Fisch gart in den letzten 6 Minuten der Reiszeit."
fehler:
  - "**Fisch zerfällt:** zu viel gerührt. Nur mit Sauce übergießen und den Spinat am Rand unterheben."
  - "**Sauce wässrig:** Fisch nicht trocken getupft. Gründlich abtupfen und die Sauce vorher 5 Minuten einköcheln."
anrichten: "Reis auf 2 tiefe Teller (je ca. 140 g gekocht), Curry daneben schöpfen und mit der {petersilie:n} bestreuen – pro Portion ca. {portion_g} g."
aufbewahrung:
  kuehlschrank_tage: 1
  einfrierbar: false
  aufwaermen: "Frisch am besten; Reste (max. 1 Tag) vorsichtig im Topf auf Stufe 3 von 9 erwärmen."
varianten:
  - "**Mit Garnelen:** 450 g Garnelen statt Seelachs, 3 Minuten garen (+2 kcal, −0,6 g Protein pro Portion)."
  - "**Mit Lachs:** 250 g Lachs (+92 kcal, −11,6 g Protein pro Portion – dann unter 45 g Protein, aber ideal bei Fett-Lücke)."
  - "**Mehr Reis:** 50 g mehr (+88 kcal pro Portion; dann über 550 kcal)."
tipps:
  - "Eine Prise Zucker oder ein paar Tropfen Süßstoff runden die Tomatensäure ab."
gargewicht_g: null
bewertung: {sterne: null, kommentar: null, datum: null}
