id: linsen-dal-ei
name: Rote-Linsen-Dal mit Ei
hauptkategorie: meal-prep
kategorien_manuell: [Meal Prep]
mahlzeit: Mittag/Abend
geschmack: herzhaft
kueche: Indisch
hauptprotein: Hülsenfrüchte & Eier
inspiration: null
schwierigkeit: leicht
zeit: {vorbereitung: 10, kochen: 30, wartezeit: 0}
ausstattung: ["Mittlerer Topf (20 cm) mit Deckel", "Kleiner Topf (16 cm)", Sieb]
restetauglich: true
vortag: []
zutaten:
  - gruppe: Dal
  - {id: linsen, zutat: Rote Linsen trocken, g: 200, name: "rote Linsen", hinweis: ""}
  - {id: oel, zutat: Rapsöl, g: 10, anzeige: "1 EL Rapsöl", hinweis: ""}
  - {id: zwiebel, zutat: Zwiebel, g: 100, anzeige: "1 Zwiebel", name: Zwiebel, hinweis: ""}
  - {id: knoblauch, zutat: Knoblauch, g: 9, anzeige: "3 Knoblauchzehen", hinweis: ""}
  - {id: ingwer, zutat: Ingwer, g: 10, anzeige: "1 Stück Ingwer (2–3 cm)", hinweis: ""}
  - {id: kurkuma, zutat: Kurkuma gemahlen, g: 2, anzeige: "1 TL Kurkuma", hinweis: ""}
  - {id: kuemmel, zutat: Kreuzkümmel gemahlen, g: 3, anzeige: "1½ TL Kreuzkümmel", hinweis: ""}
  - {id: garam, zutat: Garam Masala, g: 4, anzeige: "1½ TL Garam Masala", hinweis: ""}
  - {id: chili, zutat: Chiliflocken, g: 1, anzeige: "¼ TL Chiliflocken", hinweis: ""}
  - {id: tomaten, zutat: Tomaten gehackt (Dose), g: 400, name: "gehackte Tomaten", hinweis: "1 Dose"}
  - {id: wasser, zutat: Wasser, g: 600, name: Wasser, hinweis: "600 ml"}
  - {id: bruehe, zutat: Gemüsebrühe Pulver, g: 4, anzeige: "1 TL Gemüsebrühe-Pulver", hinweis: ""}
  - {id: salz, zutat: Salz, g: 1, anzeige: "2 Prisen Salz", hinweis: ""}
  - {id: zitrone, zutat: Zitronensaft, g: 10, anzeige: "2 TL Zitronensaft", hinweis: ""}
  - gruppe: Dazu
  - {id: eier, zutat: "Ei Gr. M ohne Schale", g: 240, anzeige: "4 Eier Gr. M", hinweis: ""}
  - {id: skyr, zutat: Skyr natur, g: 150, name: Skyr, hinweis: "als Topping"}
mise_en_place:
  - "{linsen} im Sieb kalt abspülen, bis das Wasser klar ist."
  - "{zwiebel} fein würfeln, {knoblauch} und {ingwer} fein reiben."
  - "{bruehe} in {wasser} auflösen."
schritte:
  - titel: Gewürze anrösten
    text: "{oel} im mittleren Topf auf Stufe 6 von 9 erhitzen. Zwiebel 5 Minuten goldgelb braten, Knoblauch und Ingwer 1 Minute mitbraten. {kurkuma}, {kuemmel}, {garam} und {chili} 30 Sekunden anrösten, bis es duftet."
    timer_min: 6
  - titel: Dal köcheln
    text: "Die {linsen:n}, {tomaten} und die Brühe dazugeben, auf Stufe 9 von 9 aufkochen und auf Stufe 3 von 9 mit schräg aufgelegtem Deckel 20–25 Minuten köcheln lassen, alle 5 Minuten umrühren. Fertig, wenn die Linsen zerfallen und das Dal sämig-cremig ist. Mit {salz} und {zitrone} abschmecken; ist es zu dick, einen Schuss Wasser einrühren."
    timer_min: 25
  - titel: Eier kochen
    text: "Parallel die {eier:n} im kleinen Topf mit Wasser bedeckt auf Stufe 9 von 9 aufkochen und ab Kochbeginn auf Stufe 6 von 9 8 Minuten kochen (wachsweich-fest). Kalt abschrecken, pellen und halbieren."
    timer_min: 8
zeitablauf:
  - "Während das Dal köchelt: Eier kochen und pellen."
fehler:
  - "**Dal brennt an:** zu wenig gerührt. Linsen setzen sich gern am Boden ab – regelmäßig umrühren."
  - "**Fad:** zu wenig Säure und Salz. Zitronensaft und eine Prise Salz zum Schluss machen den Unterschied."
anrichten: "Dal auf 2 tiefe Teller verteilen, je 2 halbierte Eier daraufsetzen und einen großen Klecks {skyr:n} daneben – pro Portion ca. {portion_g} g."
aufbewahrung:
  kuehlschrank_tage: 4
  einfrierbar: true
  einfrieren_monate: 3
  aufwaermen: "Dal im Topf auf Stufe 4 von 9 mit 3 EL Wasser 4 Minuten oder Mikrowelle 600 W 3 Minuten abgedeckt; Eier kalt oder kurz mit erwärmen."
  separat: "Eier gepellt und Skyr getrennt lagern (Eier ohne Dal einfrieren geht nicht)."
varianten:
  - "**Mit Hähnchen statt Ei:** 300 g Hähnchenbrust in Würfeln die letzten 10 Minuten mitköcheln bis 74 °C (−15 kcal, +20 g Protein pro Portion)."
  - "**Mit Reis:** 100 g Basmatireis dazu (+175 kcal, +38,5 g KH pro Portion; dann über 850 kcal – Portion ggf. auf 0,75 setzen)."
  - "**Mit Spinat:** 125 g Babyspinat zum Schluss unterheben (+14 kcal, +1,8 g Protein pro Portion)."
tipps:
  - "Ein „Tadka“ zum Schluss: 1 TL Öl mit ½ TL Kreuzkümmel und 1 Prise Chili kurz erhitzen und über das Dal gießen (+22 kcal pro Portion)."
gargewicht_g: null
bewertung: {sterne: null, kommentar: null, datum: null}
