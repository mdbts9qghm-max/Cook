id: ingwer-schweinefilet
name: Ingwer-Soja-Schweinefilet mit Brokkoli
hauptkategorie: kalorienarm
kategorien_manuell: []
mahlzeit: Mittag/Abend
geschmack: herzhaft
kueche: Asiatisch
hauptprotein: Schwein
inspiration: null
schwierigkeit: leicht
zeit: {vorbereitung: 8, kochen: 17, wartezeit: 0}
ausstattung: ["Wok oder große Pfanne (28 cm) mit Deckel", "Kleiner Topf mit Deckel (16 cm)", Sieb]
restetauglich: true
vortag: []
zutaten:
  - gruppe: Reis
  - {id: reis, zutat: Basmatireis ungekocht, g: 80, name: Basmatireis, hinweis: "kleine Portion"}
  - {id: wasser_reis, zutat: Wasser, g: 160, name: Wasser, hinweis: "160 ml"}
  - gruppe: Wok
  - {id: filet, zutat: Schweinefilet roh, g: 400, name: Schweinefilet, hinweis: ""}
  - {id: staerke, zutat: Speisestärke, g: 8, anzeige: "1 EL Speisestärke", hinweis: ""}
  - {id: oel, zutat: Rapsöl, g: 10, anzeige: "1 EL Rapsöl", hinweis: ""}
  - {id: brokkoli, zutat: Brokkoli, g: 400, name: Brokkoli, hinweis: "Röschen und geschälter Strunk"}
  - {id: ingwer, zutat: Ingwer, g: 15, anzeige: "1 Stück Ingwer (3 cm)", hinweis: "großzügig"}
  - {id: knoblauch, zutat: Knoblauch, g: 6, anzeige: "2 Knoblauchzehen", hinweis: ""}
  - {id: chili, zutat: Chiliflocken, g: 0.5, anzeige: "1 Prise Chiliflocken", hinweis: ""}
  - gruppe: Sauce
  - {id: soja, zutat: Sojasauce, g: 30, anzeige: "2 EL Sojasauce", hinweis: ""}
  - {id: honig, zutat: Honig, g: 10, anzeige: "2 TL Honig", hinweis: ""}
  - {id: wasser, zutat: Wasser, g: 60, name: Wasser, hinweis: "60 ml"}
  - gruppe: Topping
  - {id: fruehlingszwiebel, zutat: Frühlingszwiebel, g: 30, anzeige: "3 Frühlingszwiebeln", hinweis: ""}
  - {id: sesam, zutat: Sesam, g: 5, anzeige: "2 TL Sesam", hinweis: ""}
mise_en_place:
  - "{reis} kalt abspülen."
  - "{filet} quer in 5 mm dünne Scheiben schneiden (angefroren geht es leichter) und mit {staerke} vermischen."
  - "{brokkoli} in kleine Röschen teilen, den Strunk schälen und in dünne Scheiben schneiden. {ingwer} in feine Streifen, {knoblauch} hacken."
  - "{soja}, {honig} und {wasser} verrühren. {fruehlingszwiebel} in Ringe schneiden."
schritte:
  - titel: Reis aufsetzen
    text: "{reis:n} mit {wasser_reis} im Topf mit Deckel auf Stufe 9 von 9 aufkochen, auf Stufe 2 von 9 12 Minuten quellen und 5 Minuten nachziehen lassen."
    timer_min: 12
  - titel: Fleisch scharf anbraten
    text: "Die Hälfte vom {oel} im Wok auf Stufe 9 von 9 sehr heiß werden lassen. Die {filet:n}scheiben in einer Lage 1 Minute braten, wenden und 1 Minute weiterbraten, bis sie gebräunt sind. Die dünnen Scheiben sind dann durch (Kerntemperatur über 63 °C, innen hell mit zartrosa Hauch). Herausnehmen."
    timer_min: 2
  - titel: Brokkoli und Sauce
    text: "Restliches Öl in den Wok, Stufe 8 von 9. {brokkoli:n}, Ingwer, Knoblauch und {chili} 1 Minute pfannenrühren, dann 3 EL Wasser zugeben, Deckel auflegen und 3 Minuten dämpfen, bis der Brokkoli bissfest ist. Deckel ab, Sauce angießen, das Fleisch zurückgeben und 1 Minute schwenken, bis alles glänzt."
    timer_min: 5
zeitablauf:
  - "Reis aufsetzen; während er quillt, Fleisch schneiden und alles im Wok braten – der Wok braucht nur ca. 8 Minuten."
fehler:
  - "**Fleisch zäh:** zu dick geschnitten oder zu lange gebraten. 5 mm dünn und nur 2 Minuten."
  - "**Brokkoli matschig:** zu lange gedämpft. Nach 3 Minuten probieren – er soll noch Biss haben."
anrichten: "Reis auf 2 Teller verteilen (je ca. 110 g gekocht), Fleisch und Brokkoli daneben, mit Frühlingszwiebeln und {sesam:n} bestreuen – pro Portion ca. {portion_g} g."
aufbewahrung:
  kuehlschrank_tage: 3
  einfrierbar: false
  aufwaermen: "Mikrowelle 600 W, 2 Minuten abgedeckt, nach der Hälfte umrühren."
  separat: "Reis innerhalb von 1 Stunde abkühlen und kalt stellen."
varianten:
  - "**Mit Hähnchen:** 400 g Hähnchenbrust in Streifen, 3–4 Minuten braten bis 74 °C (−8 kcal, +3 g Protein pro Portion)."
  - "**Mit Rinderhüfte:** 400 g Hüftsteak in dünnen Streifen (+20 kcal pro Portion)."
  - "**Mehr Sättigung:** 40 g Reis mehr (+70 kcal, +15,4 g KH pro Portion; dann über 550 kcal)."
tipps:
  - "Viel frischer Ingwer ist hier der Star – lieber etwas mehr nehmen."
gargewicht_g: null
bewertung: {sterne: null, kommentar: null, datum: null}
