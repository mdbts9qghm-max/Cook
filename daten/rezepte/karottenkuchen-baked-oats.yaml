id: karottenkuchen-baked-oats
name: Karottenkuchen-Baked-Oats mit Frischkäse-Frosting
hauptkategorie: fruehstueck-snacks
kategorien_manuell: [Meal Prep]
mahlzeit: Frühstück
geschmack: süß
kueche: Amerikanisch
hauptprotein: Quark & Whey
inspiration:
  quelle: "TikTok-/Instagram-Trend „Carrot Cake Baked Oats“"
  link: null
  aenderungen: "Rüblikuchen ohne Zucker, Öl und Mehl: Haferflocken, Magerquark und Vanille-Whey; Frosting aus Frischkäse light und Skyr statt Butter-Puderzucker-Creme."
schwierigkeit: leicht
zeit: {vorbereitung: 12, kochen: 25, wartezeit: 10}
ausstattung: [Backofen, "Mixer oder Pürierstab mit hohem Rührbecher", "Auflaufform 20 × 20 cm", Backpapier, Reibe]
restetauglich: true
vortag: []
zutaten:
  - gruppe: Teig
  - {id: hafer, zutat: Haferflocken zart, g: 120, name: "zarte Haferflocken", hinweis: ""}
  - {id: eier, zutat: "Ei Gr. M ohne Schale", g: 120, anzeige: "2 Eier Gr. M", hinweis: ""}
  - {id: quark, zutat: Magerquark, g: 200, name: Magerquark, hinweis: ""}
  - {id: milch, zutat: "Milch 1,5 % Fett", g: 80, name: "Milch (1,5 %)", hinweis: "80 ml"}
  - {id: whey, zutat: Whey Protein Vanille, g: 35, name: "Vanille-Whey", hinweis: "gut 1 Messlöffel"}
  - {id: zimt, zutat: Zimt gemahlen, g: 3, anzeige: "1 gehäufter TL Zimt", hinweis: ""}
  - {id: backpulver, zutat: Backpulver, g: 4, anzeige: "1 knapper TL Backpulver", hinweis: ""}
  - {id: salz, zutat: Salz, g: 0.5, anzeige: "1 Prise Salz", hinweis: ""}
  - {id: suessstoff, zutat: Süßstoff flüssig, g: 1, anzeige: "10 Tropfen flüssiger Süßstoff", hinweis: "ca. 1 g"}
  - {id: moehre, zutat: Möhre, g: 100, anzeige: "1 große Möhre", name: Möhre, hinweis: "geschält"}
  - {id: mandeln, zutat: Mandeln, g: 15, name: Mandeln, hinweis: "grob gehackt"}
  - gruppe: Frosting
  - {id: frischkaese, zutat: Frischkäse light, g: 60, name: "Frischkäse light", hinweis: ""}
  - {id: skyr, zutat: Skyr natur, g: 60, name: Skyr, hinweis: ""}
  - {id: suessstoff_frosting, zutat: Süßstoff flüssig, g: 0.5, anzeige: "5 Tropfen flüssiger Süßstoff", hinweis: ""}
mise_en_place:
  - "Backofen auf 180 °C Ober-/Unterhitze (160 °C Umluft) vorheizen, Rost in die mittlere Schiene."
  - "Auflaufform (20 × 20 cm) mit Backpapier auslegen."
  - "{moehre} fein raspeln (feine Seite der Reibe) – feine Raspel verschwinden saftig im Teig."
  - "{mandeln} grob hacken."
schritte:
  - titel: Teig mixen
    text: "{hafer}, {eier}, {quark}, {milch}, {whey}, {zimt}, {backpulver}, {salz} und {suessstoff} im Mixer ca. 40 Sekunden zu einem glatten, dickflüssigen Teig mixen. Die geraspelte {moehre:n} und die Hälfte der gehackten {mandeln:n} mit einem Löffel unterheben."
    timer_min: null
  - titel: Backen
    text: "Teig in die Form füllen, glatt streichen und die restlichen Mandeln darüberstreuen. Im vorgeheizten Backofen bei 180 °C Ober-/Unterhitze (160 °C Umluft) auf der mittleren Schiene 25 Minuten backen. Fertig, wenn die Oberfläche goldbraun ist und ein Holzstäbchen in der Mitte sauber oder mit wenigen feuchten Krümeln herauskommt."
    timer_min: 25
  - titel: Frosting
    text: "Während die Oats backen: {frischkaese}, {skyr} und {suessstoff_frosting} glatt rühren und kalt stellen. Die Baked Oats nach dem Backen 10 Minuten abkühlen lassen (auf warmem Teig schmilzt das Frosting), dann das Frosting dick daraufstreichen."
    timer_min: 10
zeitablauf:
  - "Während der Ofen vorheizt: Möhre raspeln und Teig mixen. Während die Form backt: Frosting rühren."
fehler:
  - "**Teig zu nass:** Möhre grob geraspelt oder sehr saftig. Fein raspeln und bei sehr nassen Möhren die Raspel kurz ausdrücken."
  - "**Frosting läuft weg:** auf heiße Oats gestrichen. Mindestens 10 Minuten abkühlen lassen, für Meal Prep komplett kalt werden lassen."
  - "**Schmeckt fad:** zu wenig Zimt oder Salz. Zimt großzügig dosieren und die Prise Salz nicht weglassen – sie macht den Kuchengeschmack."
anrichten: "In der Form halbieren – eine Hälfte mit Frosting (ca. {portion_g} g) ist deine Portion. Mit einer Prise Zimt bestäuben. Für Meal Prep die zweite Hälfte mit Frosting in eine Dose mit hohem Deckel legen."
aufbewahrung:
  kuehlschrank_tage: 3
  einfrierbar: true
  einfrieren_monate: 1
  aufwaermen: "Am besten kalt (wie Rüblikuchen aus dem Kühlschrank). Ohne Frosting eingefroren: über Nacht im Kühlschrank auftauen, Frosting frisch anrühren."
  separat: "Zum Einfrieren das Frosting weglassen und frisch anrühren."
varianten:
  - "**Mit Erdnussmus statt Mandeln:** 15 g Erdnussmus in den Teig mixen (+1 kcal, +0,3 g Protein pro Portion) – nussiger, saftiger."
  - "**Ohne Frosting:** spart Zeit und Kalorien (−53 kcal, −5,7 g Protein pro Portion)."
  - "**Saftiger und süßer:** 80 g ungesüßtes Apfelmus in den Teig (+21 kcal, +4,4 g Zucker pro Portion)."
tipps:
  - "Eine Prise Ingwer oder Lebkuchengewürz zum Zimt schmeckt nach Bäckerei – ohne Kalorien."
  - "Die Oats am Vorabend backen: Über Nacht im Kühlschrank wird die Konsistenz kuchiger und das Frosting fest."
gargewicht_g: null
