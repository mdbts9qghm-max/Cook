id: erdnuss-tofu-brokkoli
name: Erdnuss-Tofu mit Brokkoli und Reis
hauptkategorie: high-protein
kategorien_manuell: []
mahlzeit: Mittag/Abend
geschmack: herzhaft
kueche: Asiatisch
hauptprotein: Tofu & Hülsenfrüchte
inspiration:
  quelle: "TikTok-/Instagram-Trend „Crispy Peanut Tofu“ aus dem Airfryer"
  link: null
  aenderungen: "Tofu im Airfryer mit 1 TL Öl statt frittiert, mehr Tofu (600 g) für über 45 g Protein, Erdnussmus abgewogen."
schwierigkeit: leicht
zeit: {vorbereitung: 10, kochen: 18, wartezeit: 0}
ausstattung: [Airfryer, "Große Pfanne (28 cm)", "Kleiner Topf mit Deckel (16 cm)", Sieb]
restetauglich: true
vortag: []
zutaten:
  - gruppe: Knuspriger Tofu
  - {id: tofu, zutat: Tofu natur, g: 600, name: Tofu, hinweis: "1½ Blöcke à 400 g, fest"}
  - {id: staerke, zutat: Speisestärke, g: 15, anzeige: "1½ EL Speisestärke", hinweis: ""}
  - {id: oel, zutat: Rapsöl, g: 5, anzeige: "1 TL Rapsöl", hinweis: ""}
  - gruppe: Erdnusssauce
  - {id: erdnussmus, zutat: Erdnussmus, g: 30, anzeige: "2 EL Erdnussmus", hinweis: ""}
  - {id: soja, zutat: Sojasauce, g: 30, anzeige: "2 EL Sojasauce", hinweis: ""}
  - {id: honig, zutat: Honig, g: 10, anzeige: "2 TL Honig", hinweis: ""}
  - {id: zitrone, zutat: Zitronensaft, g: 15, anzeige: "1 EL Zitronensaft", hinweis: ""}
  - {id: sriracha, zutat: Sriracha, g: 10, anzeige: "2 TL Sriracha", hinweis: ""}
  - {id: knoblauch, zutat: Knoblauch, g: 6, anzeige: "2 Knoblauchzehen", hinweis: ""}
  - {id: ingwer, zutat: Ingwer, g: 8, anzeige: "1 Stück Ingwer (2 cm)", hinweis: ""}
  - {id: wasser, zutat: Wasser, g: 60, name: "warmes Wasser", hinweis: "60 ml"}
  - gruppe: Beilage
  - {id: reis, zutat: Basmatireis ungekocht, g: 100, name: Basmatireis, hinweis: ""}
  - {id: wasser_reis, zutat: Wasser, g: 200, name: Wasser, hinweis: "200 ml"}
  - {id: brokkoli, zutat: Brokkoli, g: 300, name: Brokkoli, hinweis: "Röschen"}
  - {id: sesam, zutat: Sesam, g: 6, anzeige: "2 TL Sesam", hinweis: ""}
mise_en_place:
  - "{tofu} in Küchenpapier wickeln, mit einem Brett beschweren und 5 Minuten auspressen. In 2 cm Würfel schneiden, mit {oel} und dann mit {staerke} rundum bestäuben."
  - "{knoblauch} und {ingwer} fein reiben, mit {erdnussmus}, {soja}, {honig}, {zitrone}, {sriracha} und {wasser} glatt rühren."
  - "{reis} kalt abspülen, {brokkoli} in Röschen teilen."
schritte:
  - titel: Reis aufsetzen
    text: "{reis:n} mit {wasser_reis} im Topf mit Deckel auf Stufe 9 von 9 aufkochen, auf Stufe 2 von 9 12 Minuten quellen und 5 Minuten nachziehen lassen."
    timer_min: 12
  - titel: Tofu im Airfryer
    text: "Die {tofu:n}würfel in einer Lage in den Airfryer-Korb geben und bei 200 °C 15 Minuten garen, nach 7 Minuten den Korb kräftig schütteln. Fertig, wenn die Würfel rundum goldbraun sind und beim Klopfen hohl und knusprig klingen."
    timer_min: 15
  - titel: Brokkoli und Sauce
    text: "Den {brokkoli:n} mit 3 EL Wasser in der Pfanne mit Deckel auf Stufe 7 von 9 4 Minuten dämpfen. Deckel ab, die Erdnusssauce dazugießen und auf Stufe 4 von 9 1 Minute köcheln lassen, bis sie cremig ist. Den knusprigen Tofu kurz unterschwenken, damit er die Sauce annimmt, aber knusprig bleibt."
    timer_min: 5
zeitablauf:
  - "Reis aufsetzen, Tofu in den Airfryer – während beides gart: Sauce anrühren, Brokkoli dämpfen."
fehler:
  - "**Tofu nicht knusprig:** nicht ausgepresst oder Korb zu voll. 5 Minuten pressen und in einer Lage garen, ggf. in 2 Durchgängen."
  - "**Sauce zu dick:** Erdnussmus bindet stark. Esslöffelweise warmes Wasser zugeben."
anrichten: "Reis auf 2 Bowls verteilen (je ca. 140 g gekocht), Tofu und Brokkoli mit Sauce daneben, mit {sesam:n} bestreuen – pro Portion ca. {portion_g} g."
aufbewahrung:
  kuehlschrank_tage: 3
  einfrierbar: false
  aufwaermen: "Tofu im Airfryer bei 180 °C 4 Minuten aufknuspern, Reis und Brokkoli in der Mikrowelle 600 W 2 Minuten."
  separat: "Tofu getrennt von der Sauce lagern, wenn er knusprig bleiben soll."
varianten:
  - "**Mit Hähnchen:** 400 g Hähnchenbrust-Würfel statt Tofu in der Pfanne braten bis 74 °C (−177 kcal, +8 g Protein, −20,7 g Fett pro Portion)."
  - "**Mit Garnelen:** 450 g Garnelen, 3 Minuten in der Sauce garen (−219 kcal, −3 g Protein pro Portion)."
  - "**Mit Linsennudeln:** 100 g Rote-Linsen-Nudeln statt Reis (−8 kcal, +8,5 g Protein pro Portion)."
tipps:
  - "Den restlichen halben Tofublock im Planer als Vorrat übernehmen – er passt in Gochujang-Tofu-Tacos oder Tofu-Tikka-Masala."
gargewicht_g: null
bewertung: {sterne: null, kommentar: null, datum: null}
