id: beef-brokkoli
name: Beef & Broccoli mit Reis
hauptkategorie: high-protein
kategorien_manuell: []
mahlzeit: Mittag/Abend
geschmack: herzhaft
kueche: Asiatisch
hauptprotein: Rind
inspiration:
  quelle: "TikTok-/Instagram-Trend „Better than Takeout Beef and Broccoli“"
  link: null
  aenderungen: "Magere Rinderhüfte statt Flanksteak, nur 1 EL Öl statt Frittieren in der Stärkehülle, Sauce mit wenig Honig statt brauner Zucker und Austernsauce."
schwierigkeit: mittel
zeit: {vorbereitung: 10, kochen: 17, wartezeit: 0}
ausstattung: ["Wok oder große Pfanne (28 cm) mit Deckel", "Kleiner Topf mit Deckel (16 cm)", Sieb]
restetauglich: true
vortag: []
zutaten:
  - gruppe: Reis
  - {id: reis, zutat: Basmatireis ungekocht, g: 150, name: Basmatireis, hinweis: "oder Jasminreis"}
  - {id: wasser_reis, zutat: Wasser, g: 300, name: Wasser, hinweis: "300 ml"}
  - gruppe: Rind
  - {id: rind, zutat: Rinderhüftsteak roh, g: 400, anzeige: "2 Rinderhüftsteaks", name: Rinderhüfte, hinweis: "à ca. 200 g"}
  - {id: staerke, zutat: Speisestärke, g: 10, anzeige: "1 EL Speisestärke", hinweis: "5 g fürs Fleisch, 5 g für die Sauce"}
  - {id: oel, zutat: Rapsöl, g: 10, anzeige: "1 EL Rapsöl", hinweis: ""}
  - gruppe: Brokkoli und Sauce
  - {id: brokkoli, zutat: Brokkoli, g: 400, name: Brokkoli, hinweis: "Röschen"}
  - {id: knoblauch, zutat: Knoblauch, g: 6, anzeige: "2 Knoblauchzehen", hinweis: ""}
  - {id: ingwer, zutat: Ingwer, g: 8, anzeige: "1 Stück Ingwer (2 cm)", hinweis: ""}
  - {id: soja, zutat: Sojasauce, g: 30, anzeige: "2 EL Sojasauce", hinweis: ""}
  - {id: honig, zutat: Honig, g: 15, anzeige: "2 TL Honig", hinweis: "gehäuft"}
  - {id: wasser, zutat: Wasser, g: 80, name: Wasser, hinweis: "80 ml"}
  - {id: sesamoel, zutat: Sesamöl geröstet, g: 5, anzeige: "1 TL geröstetes Sesamöl", hinweis: ""}
  - {id: sesam, zutat: Sesam, g: 5, anzeige: "2 TL Sesam", hinweis: ""}
mise_en_place:
  - "{reis} kalt abspülen."
  - "{rind} 15 Minuten ins Gefrierfach legen (lässt sich dann hauchdünn schneiden), quer zur Faser in 3–4 mm dünne Streifen schneiden und mit 5 g der {staerke:n} vermischen."
  - "{brokkoli} in kleine Röschen teilen, {knoblauch} und {ingwer} fein reiben."
  - "Sauce: {soja}, {honig}, {wasser}, Knoblauch, Ingwer und die restlichen 5 g Stärke glatt rühren."
schritte:
  - titel: Reis aufsetzen
    text: "{reis:n} mit {wasser_reis} im Topf mit Deckel auf Stufe 9 von 9 aufkochen, auf Stufe 2 von 9 12 Minuten quellen und 5 Minuten nachziehen lassen."
    timer_min: 12
  - titel: Brokkoli dämpfen
    text: "Den {brokkoli:n} mit 4 EL Wasser im Wok mit Deckel auf Stufe 8 von 9 3 Minuten dämpfen, bis er leuchtend grün und bissfest ist. Herausnehmen, Wok trocken wischen."
    timer_min: 3
  - titel: Rind scharf anbraten
    text: "{oel} im Wok auf Stufe 9 von 9 sehr heiß werden lassen. Die {rind:n}streifen in einer Lage (ggf. in 2 Portionen) 1 Minute ohne Bewegen braten, wenden und 30 Sekunden weiterbraten, bis sie außen gebräunt und innen noch rosa sind. Garprobe: Die dünnen Streifen sind dann medium (Kerntemperatur ca. 58 °C) und bleiben zart."
    timer_min: 2
  - titel: Glasieren
    text: "Auf Stufe 6 von 9 zurückschalten, Sauce umrühren und in den Wok gießen. 30 Sekunden aufkochen lassen, bis sie dick und glänzend wird, dann Brokkoli und Fleisch zurückgeben und 30 Sekunden schwenken. Vom Herd nehmen und {sesamoel} unterrühren."
    timer_min: 1
zeitablauf:
  - "Reis aufsetzen, dann Brokkoli dämpfen und Rind braten – der Wok braucht nur ca. 6 Minuten."
fehler:
  - "**Fleisch zäh:** mit der Faser geschnitten oder zu lange gebraten. Quer zur Faser schneiden und nur 1½ Minuten braten."
  - "**Fleisch grau statt braun:** Wok nicht heiß genug oder zu voll. Höchste Stufe und in 2 Portionen braten."
  - "**Sauce klumpt:** Stärke abgesetzt. Direkt vor dem Zugießen umrühren."
anrichten: "Reis auf 2 Teller (je ca. 210 g gekocht), Beef & Broccoli daneben, mit {sesam:n} bestreuen – pro Portion ca. {portion_g} g."
aufbewahrung:
  kuehlschrank_tage: 3
  einfrierbar: false
  aufwaermen: "Mikrowelle 600 W, 2 Minuten abgedeckt (Fleisch wird dabei durchgegart – schmeckt trotzdem); oder kurz im Wok auf Stufe 7 von 9."
  separat: "Reis innerhalb von 1 Stunde abkühlen und kalt stellen."
varianten:
  - "**Mit Hähnchen:** 400 g Hähnchenbrust in Streifen, 3–4 Minuten braten bis 74 °C (−28 kcal, +3 g Protein pro Portion)."
  - "**Mit Garnelen:** 450 g aufgetaute TK-Garnelen, 2–3 Minuten braten bis rosa (−70 kcal, −8 g Protein pro Portion; nur 1 Tag haltbar)."
  - "**Weniger Reis:** 100 g statt 150 g (−88 kcal, −19,2 g KH pro Portion)."
tipps:
  - "Das kurze Anfrieren ist der Trick für hauchdünne Streifen wie beim Chinesen."
  - "Ein paar Chiliflocken in der Sauce machen daraus eine scharfe Sichuan-Variante."
gargewicht_g: null
bewertung: {sterne: null, kommentar: null, datum: null}
