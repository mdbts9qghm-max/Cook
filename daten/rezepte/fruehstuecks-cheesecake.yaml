id: fruehstuecks-cheesecake
name: Frühstücks-Cheesecake aus dem Ofen
hauptkategorie: meal-prep
kategorien_manuell: [Meal Prep]
mahlzeit: Frühstück
geschmack: süß
kueche: Amerikanisch
hauptprotein: Quark & Skyr
inspiration:
  quelle: "TikTok-/Instagram-Trend „High Protein Breakfast Cheesecake“"
  link: null
  aenderungen: "Doppelrahmfrischkäse, Zucker und Keksboden durch Magerquark, Skyr, Vanille-Whey und einen Haferboden mit wenig Butter ersetzt."
schwierigkeit: mittel
zeit: {vorbereitung: 15, kochen: 45, wartezeit: 135}
ausstattung: [Backofen, "Springform 18 cm", Backpapier, Schüssel, Schneebesen, "Mixer zum Mahlen"]
restetauglich: true
vortag: ["Frühstücks-Cheesecake backen – er muss mindestens 2 Stunden durchkühlen"]
zutaten:
  - gruppe: Haferboden
  - {id: hafer, zutat: Haferflocken zart, g: 60, name: "zarte Haferflocken", hinweis: ""}
  - {id: butter, zutat: Butter, g: 10, anzeige: "2 TL Butter, geschmolzen", hinweis: ""}
  - {id: suessstoff_boden, zutat: Süßstoff flüssig, g: 0.5, anzeige: "5 Tropfen flüssiger Süßstoff", hinweis: ""}
  - gruppe: Cheesecake-Masse
  - {id: quark, zutat: Magerquark, g: 500, name: Magerquark, hinweis: "1 Becher"}
  - {id: skyr, zutat: Skyr natur, g: 200, name: Skyr, hinweis: ""}
  - {id: eier, zutat: "Ei Gr. M ohne Schale", g: 120, anzeige: "2 Eier Gr. M", hinweis: "Zimmertemperatur"}
  - {id: whey, zutat: Whey Protein Vanille, g: 30, name: "Vanille-Whey", hinweis: "1 Messlöffel"}
  - {id: staerke, zutat: Speisestärke, g: 15, anzeige: "1½ EL Speisestärke", hinweis: ""}
  - {id: zitrone, zutat: Zitronensaft, g: 15, anzeige: "1 EL Zitronensaft", hinweis: ""}
  - {id: suessstoff, zutat: Süßstoff flüssig, g: 2, anzeige: "20 Tropfen flüssiger Süßstoff", hinweis: "ca. 2 g"}
  - gruppe: Topping
  - {id: himbeeren, zutat: Himbeeren TK, g: 100, name: Himbeeren, hinweis: "aufgetaut"}
mise_en_place:
  - "Backofen auf 160 °C Ober-/Unterhitze vorheizen (Umluft nicht empfohlen – trocknet die Oberfläche aus und lässt sie reißen)."
  - "Boden der Springform mit Backpapier bespannen."
  - "{hafer} im Mixer fein mahlen und mit {butter} und {suessstoff_boden} zu feuchten Krümeln mischen."
schritte:
  - titel: Boden vorbacken
    text: "Die Haferkrümel in die Springform drücken (fest, mit einem Glasboden) und im vorgeheizten Backofen bei 160 °C Ober-/Unterhitze 8 Minuten vorbacken, bis der Rand leicht goldig ist."
    timer_min: 8
  - titel: Masse rühren
    text: "{quark}, {skyr}, {eier}, {whey}, {staerke}, {zitrone} und {suessstoff} mit dem Schneebesen nur so lange glatt rühren, bis keine Klümpchen mehr da sind (zu viel Luft lässt den Cheesecake reißen)."
    timer_min: null
  - titel: Backen
    text: "Die Masse auf den vorgebackenen Boden gießen und glatt streichen. Bei 160 °C Ober-/Unterhitze auf der mittleren Schiene 40 Minuten backen. Fertig, wenn der Rand fest ist und die Mitte beim Rütteln noch wie Wackelpudding wackelt. Ofen ausschalten, Tür einen Spalt öffnen (Kochlöffel einklemmen) und den Cheesecake 15 Minuten darin ruhen lassen."
    timer_min: 40
  - titel: Durchkühlen
    text: "Herausnehmen, mit einem Messer am Rand lösen und mindestens 2 Stunden (am besten über Nacht) im Kühlschrank fest werden lassen. Erst dann die aufgetauten {himbeeren:n} darauf verteilen."
    timer_min: 120
zeitablauf:
  - "Während der Boden vorbackt: Masse rühren. Am besten am Vorabend backen – morgens ist er schnittfest."
fehler:
  - "**Oberfläche reißt:** zu heiß, Umluft oder zu viel Luft eingerührt. Ober-/Unterhitze, 160 °C und nur glatt rühren."
  - "**Mitte flüssig:** zu kurz gebacken oder nicht gekühlt. Er muss wackeln, aber nicht schwappen – und 2 Stunden kühlen."
  - "**Boden matschig:** nicht vorgebacken. Die 8 Minuten Vorbacken nicht überspringen."
anrichten: "In 4 Stücke schneiden – 2 Stücke (ca. {portion_g} g) mit Himbeeren sind deine Portion. Für Meal Prep die Stücke einzeln in Dosen legen."
aufbewahrung:
  kuehlschrank_tage: 4
  einfrierbar: true
  einfrieren_monate: 1
  aufwaermen: "Nicht aufwärmen – kalt aus dem Kühlschrank. Eingefroren über Nacht im Kühlschrank auftauen."
  separat: "Himbeeren getrennt lagern und erst beim Essen daraufgeben."
varianten:
  - "**Kirsch-Cheesecake:** 100 g Sauerkirschen statt Himbeeren (+12 kcal, +5,3 g Zucker pro Portion)."
  - "**Ohne Boden:** Haferboden weglassen, direkt in die Form (−149 kcal, −17,6 g KH pro Portion) – dann eher ein Snack."
  - "**Schoko-Cheesecake:** 15 g Backkakao in die Masse (+23 kcal, +1,6 g Protein pro Portion)."
tipps:
  - "Abgeriebene Zitronenschale und Vanillearoma in der Masse – dann schmeckt er wie New York Cheesecake."
gargewicht_g: null
bewertung: {sterne: null, kommentar: null, datum: null}
